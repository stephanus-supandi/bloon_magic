<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLOONMAGIC — THE IMPOSSIBLE SHOW</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Georgia', serif; }
canvas { display: block; position: absolute; top: 0; left: 0; }
#ui-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#ui-overlay.active { pointer-events: all; }
.menu-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.5s;
}
.menu-screen.visible { opacity: 1; }
.menu-title {
  font-size: clamp(24px, 5vw, 64px); color: #d4af37;
  text-shadow: 0 0 20px #d4af37, 0 0 40px #8b0000;
  letter-spacing: 4px; margin-bottom: 10px; text-align: center;
}
.menu-subtitle {
  font-size: clamp(12px, 2.5vw, 24px); color: #8b0000;
  text-shadow: 0 0 10px #8b0000; margin-bottom: 40px; text-align: center;
}
.menu-btn {
  background: transparent; border: 2px solid #d4af37; color: #d4af37;
  padding: 12px 40px; margin: 8px; font-size: clamp(14px, 2vw, 20px);
  cursor: pointer; font-family: 'Georgia', serif; letter-spacing: 2px;
  transition: all 0.3s; pointer-events: all;
}
.menu-btn:hover, .menu-btn:active {
  background: rgba(212,175,55,0.2); box-shadow: 0 0 20px rgba(212,175,55,0.5);
}
.act-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px; max-width: 600px; width: 90%; padding: 20px;
}
.act-btn {
  background: rgba(20,0,0,0.8); border: 1px solid #d4af37; color: #d4af37;
  padding: 15px 10px; cursor: pointer; font-family: 'Georgia', serif;
  font-size: clamp(10px, 1.5vw, 14px); text-align: center; transition: all 0.3s;
  pointer-events: all;
}
.act-btn:hover { background: rgba(139,0,0,0.4); }
.act-btn.locked { opacity: 0.4; cursor: not-allowed; border-color: #555; color: #555; }
.act-btn.completed { border-color: #00ff00; }
#hud {
  position: absolute; top: 10px; left: 10px; right: 10px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; font-size: clamp(10px, 1.5vw, 14px); color: #d4af37;
}
.hud-item { text-shadow: 0 0 5px #d4af37; margin: 2px 0; }
#audience-msg {
  position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: clamp(12px, 2vw, 18px); text-align: center;
  opacity: 0; transition: opacity 0.5s; pointer-events: none;
  text-shadow: 0 0 10px rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 4px;
}
#touch-controls {
  position: absolute; bottom: 10px; left: 0; right: 0;
  display: none; justify-content: center; gap: 10px; pointer-events: none;
}
.touch-btn {
  background: rgba(212,175,55,0.3); border: 1px solid #d4af37;
  color: #d4af37; padding: 12px 20px; font-size: 14px;
  border-radius: 50%; pointer-events: all; cursor: pointer;
}
@media (pointer: coarse) { #touch-controls { display: flex; } }
#transition-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; opacity: 0; pointer-events: none; z-index: 20;
  transition: opacity 0.5s;
}
</style>

<script>
'use strict';
window.addEventListener('error', function(e) { console.error('BLOONMAGIC runtime error:', e.error || e.message); });
// ==================== AUDIO ENGINE ====================
const Audio = (() => {
  let ctx = null;
  let masterGain = null;
  let droneOsc = null;
  let droneGain = null;
  let initialized = false;

  function init() {
    if (initialized) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.3;
      masterGain.connect(ctx.destination);
      initialized = true;
    } catch(e) { console.log('Audio not available'); }
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function startDrone() {
    if (!initialized) return;
    if (droneOsc) return;
    droneOsc = ctx.createOscillator();
    droneGain = ctx.createGain();
    droneOsc.type = 'sawtooth';
    droneOsc.frequency.value = 55;
    droneGain.gain.value = 0.05;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    droneOsc.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(masterGain);
    droneOsc.start();
    // LFO for eerie effect
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    lfo.frequency.value = 0.5;
    lfoGain.gain.value = 10;
    lfo.connect(lfoGain);
    lfoGain.connect(droneOsc.frequency);
    lfo.start();
  }

  function stopDrone() {
    if (droneOsc) { try { droneOsc.stop(); } catch(e){} droneOsc = null; }
  }

  function playTone(freq, duration, type='sine', vol=0.1) {
    if (!initialized) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function playNoise(duration, vol=0.05) {
    if (!initialized) return;
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1000;
    filter.Q.value = 0.5;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    source.start();
  }

  function cardFlip() { playTone(800, 0.1, 'square', 0.05); setTimeout(() => playTone(1200, 0.05, 'square', 0.03), 50); }
  function coinSound() { playTone(2000, 0.15, 'sine', 0.08); playTone(3000, 0.1, 'sine', 0.05); }
  function ropeSound() { playNoise(0.3, 0.03); playTone(150, 0.2, 'sawtooth', 0.02); }
  function magicImpact() { playTone(100, 0.5, 'sine', 0.15); playNoise(0.3, 0.1); playTone(400, 0.3, 'triangle', 0.08); }
  function heartbeat() { playTone(60, 0.15, 'sine', 0.12); setTimeout(() => playTone(50, 0.1, 'sine', 0.08), 200); }
  function audienceCheer() { playNoise(1.0, 0.08); playTone(300, 0.5, 'sawtooth', 0.03); }
  function dramaticSting() { playTone(200, 1.0, 'sawtooth', 0.1); playTone(250, 1.0, 'sawtooth', 0.08); playTone(100, 1.5, 'sine', 0.12); }
  function windSound() { playNoise(2.0, 0.02); }
  function successSound() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'sine', 0.1), i*100)); }
  function failSound() { [400,350,300,200].forEach((f,i) => setTimeout(() => playTone(f, 0.4, 'sawtooth', 0.08), i*150)); }

  return { init, resume, startDrone, stopDrone, cardFlip, coinSound, ropeSound, magicImpact, heartbeat, audienceCheer, dramaticSting, windSound, successSound, failSound, playTone };
})();

// ==================== PARTICLE SYSTEM ====================
class Particle {
  constructor(x, y, vx, vy, life, size, color, type='circle') {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.size = size;
    this.color = color; this.type = type; this.alpha = 1;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    this.alpha = Math.max(0, this.life / this.maxLife);
    if (this.type === 'smoke') { this.size += dt * 20; this.vy -= dt * 10; }
    if (this.type === 'dust') { this.vx += Math.sin(this.life * 3) * dt * 5; }
    return this.life > 0;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha * 0.6;
    if (this.type === 'smoke') {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      grad.addColorStop(0, this.color);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
    } else if (this.type === 'spark') {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

const Particles = {
  list: [],
  add(p) { if (this.list.length >= 800) this.list.splice(0, 100); this.list.push(p); },
  update(dt) { this.list = this.list.filter(p => p.update(dt)); },
  draw(ctx) { this.list.forEach(p => p.draw(ctx)); },
  clear() { this.list = []; },
  emitSmoke(x, y, count=5) {
    for (let i = 0; i < count; i++) {
      this.add(new Particle(x + (Math.random()-0.5)*20, y, (Math.random()-0.5)*10, -Math.random()*30-10, 2+Math.random()*2, 5+Math.random()*10, 'rgba(100,100,120,0.3)', 'smoke'));
    }
  },
  emitDust(count=3, w, h) {
    for (let i = 0; i < count; i++) {
      this.add(new Particle(Math.random()*w, Math.random()*h, (Math.random()-0.5)*5, Math.random()*5+2, 3+Math.random()*3, 1+Math.random()*2, 'rgba(212,175,55,0.4)', 'dust'));
    }
  },
  emitSparks(x, y, count=10) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 200 + 50;
      this.add(new Particle(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed, 0.5+Math.random()*0.5, 2+Math.random()*3, '#d4af37', 'spark'));
    }
  }
};

// ==================== RENDERER ====================
const Renderer = (() => {
  let canvas, ctx;
  let W, H;
  let spotlightX = 0.5, spotlightY = 0.3;
  let spotlightIntensity = 1;
  let time = 0;

  function init(c) {
    canvas = c;
    ctx = canvas.getContext('2d');
    resize();
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function clear() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function drawStage() {
    // Floor
    const floorY = H * 0.75;
    const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
    floorGrad.addColorStop(0, '#1a0505');
    floorGrad.addColorStop(1, '#000');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY, W, H - floorY);

    // Floor line
    ctx.strokeStyle = 'rgba(139,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, floorY);
    ctx.lineTo(W, floorY);
    ctx.stroke();

    // Curtains
    const curtainW = W * 0.08;
    const curtGrad = ctx.createLinearGradient(0, 0, curtainW, 0);
    curtGrad.addColorStop(0, '#2a0000');
    curtGrad.addColorStop(0.5, '#4a0000');
    curtGrad.addColorStop(1, '#1a0000');
    ctx.fillStyle = curtGrad;
    ctx.fillRect(0, 0, curtainW, H);

    const curtGrad2 = ctx.createLinearGradient(W - curtainW, 0, W, 0);
    curtGrad2.addColorStop(0, '#1a0000');
    curtGrad2.addColorStop(0.5, '#4a0000');
    curtGrad2.addColorStop(1, '#2a0000');
    ctx.fillStyle = curtGrad2;
    ctx.fillRect(W - curtainW, 0, curtainW, H);

    // Curtain folds
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(80,0,0,${0.3 - i*0.05})`;
      ctx.beginPath();
      ctx.moveTo(curtainW * (i/5), 0);
      ctx.quadraticCurveTo(curtainW * (i/5) + 5, H/2, curtainW * (i/5), H);
      ctx.stroke();
    }
  }

  function drawSpotlight() {
    const sx = spotlightX * W;
    const sy = spotlightY * H;
    const radius = Math.min(W, H) * 0.4 * spotlightIntensity;

    // Volumetric cone
    ctx.save();
    ctx.globalAlpha = 0.1 * spotlightIntensity;
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx - radius * 0.8, H * 0.8);
    ctx.lineTo(sx + radius * 0.8, H * 0.8);
    ctx.closePath();
    const coneGrad = ctx.createLinearGradient(sx, 0, sx, H * 0.8);
    coneGrad.addColorStop(0, 'rgba(255,255,200,0.3)');
    coneGrad.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = coneGrad;
    ctx.fill();
    ctx.restore();

    // Spotlight pool
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
    grad.addColorStop(0, `rgba(255,250,220,${0.15 * spotlightIntensity})`);
    grad.addColorStop(0.5, `rgba(255,200,100,${0.05 * spotlightIntensity})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBloon(x, y, scale=1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 80, 30, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body (silhouette)
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(-20, 80);
    ctx.lineTo(-25, 20);
    ctx.quadraticCurveTo(-30, -10, -15, -30);
    ctx.lineTo(-10, -50);
    ctx.quadraticCurveTo(0, -70, 10, -50);
    ctx.lineTo(15, -30);
    ctx.quadraticCurveTo(30, -10, 25, 20);
    ctx.lineTo(20, 80);
    ctx.closePath();
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(0, -60, 18, 0, Math.PI * 2);
    ctx.fill();

    // Hat (top hat)
    ctx.fillRect(-15, -95, 30, 20);
    ctx.fillRect(-20, -78, 40, 5);

    // Cape
    ctx.fillStyle = '#1a0000';
    ctx.beginPath();
    ctx.moveTo(-20, -30);
    ctx.quadraticCurveTo(-40, 20, -35, 70);
    ctx.lineTo(-20, 80);
    ctx.lineTo(-20, -30);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(20, -30);
    ctx.quadraticCurveTo(40, 20, 35, 70);
    ctx.lineTo(20, 80);
    ctx.lineTo(20, -30);
    ctx.fill();

    // Gold trim
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-15, -78);
    ctx.lineTo(15, -78);
    ctx.stroke();

    // Eyes (glowing)
    ctx.fillStyle = `rgba(212,175,55,${0.5 + Math.sin(time * 2) * 0.3})`;
    ctx.beginPath();
    ctx.arc(-6, -62, 2, 0, Math.PI * 2);
    ctx.arc(6, -62, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawVignette() {
    const grad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function setSpotlight(x, y, intensity) {
    spotlightX = x; spotlightY = y; spotlightIntensity = intensity;
  }

  function getTime() { return time; }
  function getCtx() { return ctx; }
  function getW() { return W; }
  function getH() { return H; }

  function update(dt) { time += dt; }

  return { init, resize, clear, drawStage, drawSpotlight, drawBloon, drawVignette, setSpotlight, getTime, getCtx, getW, getH, update };
})();

// ==================== GAME STATE ====================
const Game = (() => {
  let state = 'start'; // start, menu, playing, paused, success, failure, ending
  let currentAct = 0;
  let score = 0;
  let combo = 1;
  let mystery = 100;
  let excitement = 50;
  let actsCompleted = [false, false, false, false, false, false, false];
  let actsUnlocked = [true, false, false, false, false, false, false];
  let actInstance = null;
  let lastTime = 0;
  let audienceMsgTimer = 0;
  let transitionTimer = 0;
  let dustTimer = 0;
  let smokeTimer = 0;

  const actNames = [
    'IMPOSSIBLE CARD', 'BLACK MIRROR', 'VANISHING COIN',
    'ENDLESS ROPE', 'IMPOSSIBLE BOX', 'THE PREDICTION', 'FINAL ACT'
  ];

  const audienceMessages = [
    "Bang, itu sulap apa JavaScript?",
    "Anjir, kartunya pindah sendiri.",
    "Bro, gue lihat source code-nya.",
    "INI BUKAN SULAP. INI CANVAS.",
    "Bang, kok magician-nya belum dibayar?",
    "Woy, gue mau liat triknya bukan liat loading!",
    "Ini trick apa bug?",
    "Masa kartu bisa ngilang? Hacker nih.",
    "Bang, bagi password WiFi dong sekalian.",
    "Gue udah screenshot, nanti gue bongkar.",
    "Ini pakai AI ya?",
    "Anjay, kok bisa?!",
    "Triknya apa bang? Ajarin dong.",
    "Kalau gagal, refund dong.",
    "Ini show atau debugging session?"
  ];

  function showAudienceMessage() {
    const el = document.getElementById('audience-msg');
    el.textContent = audienceMessages[Math.floor(Math.random() * audienceMessages.length)];
    el.style.opacity = '1';
    audienceMsgTimer = 3;
  }

  function updateHUD() {
    document.getElementById('hud-score').textContent = `SKOR: ${score}`;
    document.getElementById('hud-combo').textContent = `COMBO: x${combo}`;
    document.getElementById('hud-mystery').textContent = `MISTERI: ${Math.round(mystery)}%`;
    document.getElementById('hud-excitement').textContent = `PENONTON: ${Math.round(excitement)}%`;
    document.getElementById('hud-act').textContent = actNames[currentAct] || '';
  }

  function showScreen(id) {
    document.querySelectorAll('.menu-screen').forEach(s => s.classList.remove('visible'));
    const el = document.getElementById(id);
    if (el) el.classList.add('visible');
    document.getElementById('ui-overlay').classList.toggle('active', id !== null);
  }

  function transition(callback) {
    const overlay = document.getElementById('transition-overlay');
    overlay.style.opacity = '1';
    setTimeout(() => {
      callback();
      setTimeout(() => { overlay.style.opacity = '0'; }, 100);
    }, 500);
  }

  function startGame() {
    // Audio is optional; browser autoplay/security policies must never block the game.
    try {
      Audio.init();
      Audio.resume();
      Audio.startDrone();
    } catch (e) {
      console.warn('BLOONMAGIC audio disabled:', e);
    }

    state = 'menu';
    document.getElementById('hud').style.display = 'none';
    showScreen('menu-screen');
    buildActGrid();
  }

  function buildActGrid() {
    const grid = document.getElementById('act-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 7; i++) {
      const btn = document.createElement('button');
      btn.className = 'act-btn';
      if (!actsUnlocked[i]) btn.classList.add('locked');
      if (actsCompleted[i]) btn.classList.add('completed');
      btn.textContent = `${i+1}. ${actNames[i]}${actsCompleted[i] ? ' ✓' : actsUnlocked[i] ? '' : ' 🔒'}`;
      if (actsUnlocked[i]) {
        btn.onclick = () => selectAct(i);
      }
      grid.appendChild(btn);
    }
  }

  function selectAct(idx) {
    currentAct = idx;
    transition(() => {
      state = 'playing';
      showScreen(null);
      document.getElementById('hud').style.display = 'flex';
      startAct(idx);
    });
  }

  function startAct(idx) {
    Particles.clear();
    mystery = 100;
    excitement = 50;
    switch(idx) {
      case 0: actInstance = new CardAct(); break;
      case 1: actInstance = new MirrorAct(); break;
      case 2: actInstance = new CoinAct(); break;
      case 3: actInstance = new RopeAct(); break;
      case 4: actInstance = new BoxAct(); break;
      case 5: actInstance = new PredictionAct(); break;
      case 6: actInstance = new FinalAct(); break;

    if (actInstance) actInstance.init();
    updateHUD();

  function actSuccess() {
    state = 'success';
    Audio.successSound();
    Audio.audienceCheer();
    actsCompleted[currentAct] = true;
    if (currentAct < 6) actsUnlocked[currentAct + 1] = true;
    score += 1000 * combo;
    excitement = Math.min(100, excitement + 30);
    document.getElementById('success-text').textContent = `${actNames[currentAct]} SELESAI! +${1000*combo} poin`;
    document.getElementById('hud').style.display = 'none';

    if (actsCompleted.every(c => c)) {
      setTimeout(() => showEnding(), 2000);

  function actFailure() {

    Audio.failSound();
    mystery = Math.max(0, mystery - 30);

  function nextAct() {

  function restartAct() {

      showScreen(null);

  }

  function pause() {
    if (state === 'playing') {
      state = 'paused';
      showScreen('pause-screen');

  }

  function resume() {
    state = 'playing';
    showScreen(null);
  }

  function backToMenu() {
    transition(() => {
      state = 'menu';
      document.getElementById('hud').style.display = 'none';

  }

  function backToStart() {

  function showCredits() {

  }

  function showEnding() {

    if (mystery > 70 && score > 5000) {
      endingTitle = '✦ ENDING: THE IMPOSSIBLE ONE ✦';
      endingText = 'Kamu berhasil menyelesaikan semua trik dengan kesempurnaan misterius. Penonton masih bertanya-tanya... apakah ini benar-benar sulap, atau hanya kode yang berjalan di browser mereka? BLOON menghilang ke dalam kegelapan, meninggalkan hanya jejak partikel emas dan pertanyaan yang tak terjawab. LEGENDA HIDUP.';
    } else if (score > 3000) {
      endingTitle = '✦ ENDING: MASTER ILLUSIONIST ✦';
      endingText = 'Pertunjukan selesai dengan gemilang. Penonton bertepuk tangan, meski beberapa masih mencoba mencari tahu bagaimana triknya bekerja. BLOON membungkuk, lalu menghilang dalam asap. Mungkin besok malam, show akan dimulai lagi...';
    } else {
      endingTitle = '✦ ENDING: THE LEARNING CURVE ✦';
      endingText = 'Pertunjukan berakhir... dengan beberapa insiden. Penonton pulang dengan campuran kekaguman dan kebingungan. BLOON berjanji akan berlatih lebih keras. "Besok malam," bisiknya, "akan berbeda." Tapi apakah? Hanya waktu yang tahu.';
    }
    transition(() => {
      state = 'ending';
      document.getElementById('hud').style.display = 'none';
      document.getElementById('ending-title').textContent = endingTitle;
      document.getElementById('ending-text').textContent = endingText;
      showScreen('ending-screen');
    });
  }

  function touchAction(action) {
    Audio.init();
    Audio.resume();
    if (action === 'space') handleKey('Space');
    else if (action === 'interact') handleKey('KeyE');
    else if (action === 'pause') handleKey('Escape');
  }

  function handleKey(code) {
    Audio.init();
    Audio.resume();
    if (code === 'Escape') {
      if (state === 'playing') pause();
      else if (state === 'paused') resume();

    if (code === 'KeyR' && (state === 'playing' || state === 'paused')) {
      restartAct();
      return;
    }
    if (state === 'playing' && actInstance) {
      actInstance.handleInput(code);

  function handleClick(x, y) {
    Audio.init();
    Audio.resume();
    if (state === 'playing' && actInstance) {

    }
  }

  function update(dt) {
    Renderer.update(dt);
    Particles.update(dt);
    Particles.emitDust(1, Renderer.getW(), Renderer.getH());

    if (audienceMsgTimer > 0) {
      audienceMsgTimer -= dt;
      if (audienceMsgTimer <= 0) {
        document.getElementById('audience-msg').style.opacity = '0';
      }
    }

    if (state === 'playing' && actInstance) {
      actInstance.update(dt);
      // Random audience message
      if (Math.random() < dt * 0.1) showAudienceMessage();
      updateHUD();
    }
  }

  function draw() {
    Renderer.clear();
    Renderer.drawStage();
    Renderer.drawSpotlight();

    if (state === 'playing' && actInstance) {
      actInstance.draw();
    } else if (state === 'start' || state === 'menu') {
      Renderer.drawBloon(Renderer.getW()/2, Renderer.getH()*0.55, 1.5);
      Particles.emitSmoke(Renderer.getW()/2, Renderer.getH()*0.7, 1);
    }

    Particles.draw(Renderer.getCtx());
    Renderer.drawVignette();

  function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
  }

  function init() {
    const canvas = document.getElementById('gameCanvas');
    Renderer.init(canvas);

    const startBtn = document.getElementById('start-game-btn');
    const creditsBtn = document.getElementById('credits-btn');
    let startLock = false;

    const startOnce = (e) => {
      e.preventDefault();
      if (startLock) return;
      startLock = true;
      startGame();
      setTimeout(() => { startLock = false; }, 400);
    };

    if (startBtn) {
      startBtn.addEventListener('click', startOnce);

    }

    if (creditsBtn) {
      creditsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        showCredits();

    window.addEventListener('resize', () => Renderer.resize());
    window.addEventListener('keydown', e => { e.preventDefault(); handleKey(e.code); });
    canvas.addEventListener('click', e => handleClick(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      handleClick(t.clientX, t.clientY);
    }, { passive: false });
    showScreen('start-screen');
    requestAnimationFrame(gameLoop);
  }

  return { init, startGame, showCredits, selectAct, pause, resume, restartAct, backToMenu, backToStart, nextAct, touchAction, actSuccess, actFailure, getState: () => state, getScore: () => score, getCombo: () => combo, setCombo: c => combo = c, addScore: s => score += s, addExcitement: e => excitement = Math.min(100, excitement + e), addMystery: m => mystery = Math.max(0, mystery + m), getMystery: () => mystery, getExcitement: () => excitement };
})();

// ==================== ACT 1: IMPOSSIBLE CARD ====================
class CardAct {
  constructor() {
    this.cards = [];
    this.targetCard = -1;
    this.phase = 'show'; // show, memorize, shuffle, select
    this.shuffleCount = 0;
    this.maxShuffles = 3;
    this.selectedCard = -1;
    this.timer = 0;
    this.animTimer = 0;
    this.message = '';
    this.messageTimer = 0;
    this.cardSymbols = ['♠','♥','♦','♣','★','●','▲','■','◆','♛'];
  }

  init() {
    const W = Renderer.getW(), H = Renderer.getH();
    this.cards = [];
    const numCards = 5;
    const cardW = Math.min(80, W * 0.12);
    const cardH = cardW * 1.4;
    const totalW = numCards * (cardW + 10);
    const startX = (W - totalW) / 2;
    const y = H * 0.45;

    for (let i = 0; i < numCards; i++) {
      this.cards.push({
        x: startX + i * (cardW + 10),
        y: y,
        w: cardW,
        h: cardH,
        symbol: this.cardSymbols[i],
        originalIndex: i,
        revealed: true,
        flipping: false,
        flipProgress: 0
      });
    }
    this.targetCard = Math.floor(Math.random() * numCards);
    this.phase = 'show';
    this.timer = 3;
    this.message = 'HAFALKAN POSISI KARTU INI...';
    this.messageTimer = 3;
    Renderer.setSpotlight(0.5, 0.45, 1.2);
  }

  update(dt) {
    this.animTimer += dt;
    if (this.messageTimer > 0) this.messageTimer -= dt;

    if (this.phase === 'show') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.phase = 'shuffle';
        this.shuffleCount = 0;
        this.doShuffle();
      }
    }

    if (this.phase === 'shuffle') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.shuffleCount++;
        if (this.shuffleCount >= this.maxShuffles) {
          this.phase = 'select';
          this.cards.forEach(c => c.revealed = false);
          this.message = 'PILIH KARTU YANG BENAR!';
          this.messageTimer = 5;
        } else {
          this.doShuffle();
        }
      }
    }

    // Animate card flips
    this.cards.forEach(c => {
      if (c.flipping) {
        c.flipProgress += dt * 3;
        if (c.flipProgress >= 1) {
          c.flipping = false;
          c.flipProgress = 1;
        }
      }
    });
  }

  doShuffle() {
    Audio.cardFlip();
    const W = Renderer.getW();
    const cardW = this.cards[0].w;
    // Shuffle positions
    const positions = this.cards.map(c => c.x);
    for (let i = positions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [positions[i], positions[j]] = [positions[j], positions[i]];
    }
    this.cards.forEach((c, i) => {
      c.x = positions[i];
      c.flipping = true;
      c.flipProgress = 0;
      c.revealed = false;
    });
    this.timer = 1.5;
    this.message = `KOCOK #${this.shuffleCount + 1}/${this.maxShuffles}`;
    this.messageTimer = 1.5;
  }

  handleClick(x, y) {
    if (this.phase !== 'select') return;
    for (let i = 0; i < this.cards.length; i++) {
      const c = this.cards[i];
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        this.selectedCard = i;
        c.revealed = true;
        c.flipping = true;
        c.flipProgress = 0;
        Audio.cardFlip();
        setTimeout(() => {
          if (i === this.targetCard) {
            Game.addScore(500 * Game.getCombo());
            Game.setCombo(Game.getCombo() + 1);
            Game.addExcitement(20);
            Particles.emitSparks(c.x + c.w/2, c.y + c.h/2, 20);
            Audio.magicImpact();
            Game.actSuccess();
          } else {
            // Reveal correct card
            this.cards[this.targetCard].revealed = true;
            Game.actFailure();
          }
        }, 600);
        this.phase = 'done';
        break;
      }
    }
  }

  handleInput(code) {
    if (code === 'Space' && this.phase === 'show') {
      this.timer = 0;
    }
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon
    Renderer.drawBloon(W * 0.15, H * 0.6, 0.8);

    // Draw cards
    this.cards.forEach((c, i) => {
      ctx.save();
      const cx = c.x + c.w/2;
      const cy = c.y + c.h/2;
      ctx.translate(cx, cy);

      // Flip animation
      if (c.flipping) {
        const scaleX = Math.cos(c.flipProgress * Math.PI);
        ctx.scale(scaleX, 1);
      }

      // Card back
      ctx.fillStyle = '#1a0033';
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
      ctx.strokeRect(-c.w/2, -c.h/2, c.w, c.h);

      // Card face (if revealed)
      if (c.revealed && (!c.flipping || c.flipProgress > 0.5)) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(-c.w/2 + 4, -c.h/2 + 4, c.w - 8, c.h - 8);
        ctx.fillStyle = i === this.targetCard ? '#8b0000' : '#333';
        ctx.font = `${c.w * 0.5}px Georgia`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.symbol, 0, 0);
      } else {
        // Card back pattern
        ctx.strokeStyle = 'rgba(212,175,55,0.3)';
        ctx.lineWidth = 1;
        for (let j = 0; j < 3; j++) {
          ctx.strokeRect(-c.w/2 + 6 + j*4, -c.h/2 + 6 + j*4, c.w - 12 - j*8, c.h - 12 - j*8);
        }
      }
      ctx.restore();
    });

    // Message
    if (this.messageTimer > 0) {
      ctx.fillStyle = `rgba(212,175,55,${Math.min(1, this.messageTimer)})`;
      ctx.font = `${Math.min(24, W*0.04)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText(this.message, W/2, H * 0.25);
    }

    // Instructions
    if (this.phase === 'select') {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `${Math.min(14, W*0.025)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText('Klik kartu yang kamu ingat!', W/2, H * 0.85);
    }
  }
}

// ==================== ACT 2: BLACK MIRROR ====================
class MirrorAct {
  constructor() {
    this.phase = 'observe';
    this.timer = 0;
    this.differences = [];
    this.found = 0;
    this.totalDiffs = 3;
    this.mirrorFrame = {};
    this.clicked = [];
  }

  init() {
    const W = Renderer.getW(), H = Renderer.getH();
    const frameW = Math.min(300, W * 0.4);
    const frameH = frameW * 1.2;
    this.mirrorFrame = {
      x: W/2 - frameW/2,
      y: H * 0.2,
      w: frameW,
      h: frameH
    };

    // Generate differences (subtle visual anomalies)
    this.differences = [];
    for (let i = 0; i < this.totalDiffs; i++) {
      this.differences.push({
        x: this.mirrorFrame.x + 20 + Math.random() * (frameW - 40),
        y: this.mirrorFrame.y + 20 + Math.random() * (frameH - 40),
        r: 15 + Math.random() * 10,
        found: false,
        type: Math.floor(Math.random() * 3) // 0=wrong color, 1=moving, 2=extra element
      });
    }

    this.phase = 'observe';
    this.timer = 4;
    this.found = 0;
    this.clicked = [];
    Renderer.setSpotlight(0.5, 0.4, 1.0);
  }

  update(dt) {
    if (this.phase === 'observe') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.phase = 'find';
      }
    }
    // Animate type 1 differences (subtle movement)
    this.differences.forEach(d => {
      if (d.type === 1 && !d.found) {
        d.x += Math.sin(Renderer.getTime() * 2 + d.y) * 0.3;
      }
    });
  }

  handleClick(x, y) {
    if (this.phase !== 'find') return;
    for (let d of this.differences) {
      if (d.found) continue;
      const dist = Math.sqrt((x - d.x) ** 2 + (y - d.y) ** 2);
      if (dist < d.r + 10) {
        d.found = true;
        this.found++;
        Audio.magicImpact();
        Particles.emitSparks(d.x, d.y, 15);
        Game.addScore(300 * Game.getCombo());
        Game.addExcitement(10);
        if (this.found >= this.totalDiffs) {
          setTimeout(() => Game.actSuccess(), 500);
        }
        return;
      }
    }
    // Wrong click
    //mystery = Game.getMystery() - 5;
    Game.addMystery(-5);
    Audio.playTone(150, 0.2, 'sawtooth', 0.05);
  }

  handleInput(code) {
    if (code === 'Space' && this.phase === 'observe') {
      this.timer = 0;
    }
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();
    const f = this.mirrorFrame;

    // Draw Bloon beside mirror
    Renderer.drawBloon(W * 0.85, H * 0.6, 0.7);

    // Mirror frame
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 4;
    ctx.strokeRect(f.x - 5, f.y - 5, f.w + 10, f.h + 10);

    // Mirror surface
    const mirrorGrad = ctx.createLinearGradient(f.x, f.y, f.x + f.w, f.y + f.h);
    mirrorGrad.addColorStop(0, '#0a0a1a');
    mirrorGrad.addColorStop(0.5, '#1a1a3a');
    mirrorGrad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = mirrorGrad;
    ctx.fillRect(f.x, f.y, f.w, f.h);

    // Reflection of Bloon (silhouette in mirror)
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.translate(f.x + f.w/2, f.y + f.h/2);
    ctx.scale(-0.5, 0.5); // Flipped reflection
    // Simple silhouette
    ctx.fillStyle = '#2a2a4a';
    ctx.beginPath();
    ctx.arc(0, -40, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-12, -25, 24, 50);
    ctx.fillRect(-10, -60, 20, 15);
    ctx.restore();

    // Draw differences
    this.differences.forEach(d => {
      if (d.found) {
        // Show found marker
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,255,136,0.2)';
        ctx.fill();
      } else {
        // Subtle anomaly
        if (d.type === 0) {
          // Wrong color spot
          ctx.fillStyle = `rgba(139,0,0,${0.3 + Math.sin(Renderer.getTime() * 3) * 0.1})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 1) {
          // Moving distortion
          ctx.fillStyle = `rgba(100,100,200,${0.2 + Math.sin(Renderer.getTime() * 5) * 0.1})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r * 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Extra element (small eye)
          ctx.fillStyle = `rgba(212,175,55,${0.4 + Math.sin(Renderer.getTime() * 2) * 0.2})`;
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, d.r * 0.4, d.r * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r * 0.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    });

    // Mirror shimmer
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#fff';
    const shimmerX = f.x + (Math.sin(Renderer.getTime()) * 0.5 + 0.5) * f.w;
    ctx.fillRect(shimmerX - 20, f.y, 40, f.h);
    ctx.restore();

    // Instructions
    ctx.fillStyle = '#d4af37';
    ctx.font = `${Math.min(18, W*0.03)}px Georgia`;
    ctx.textAlign = 'center';
    if (this.phase === 'observe') {
      ctx.fillText(`AMATI CERMIN... ${Math.ceil(this.timer)}`, W/2, f.y + f.h + 40);
    } else {
      ctx.fillText(`TEMUKAN ANOMALI: ${this.found}/${this.totalDiffs}`, W/2, f.y + f.h + 40);
      ctx.font = `${Math.min(12, W*0.02)}px Georgia`;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('Klik area yang terlihat aneh di cermin', W/2, f.y + f.h + 60);
    }
  }
}

// ==================== ACT 3: VANISHING COIN ====================
class CoinAct {
  constructor() {
    this.phase = 'ready';
    this.coinY = 0;
    this.coinVel = 0;
    this.handX = 0.5;
    this.targetZone = { start: 0, end: 0 };
    this.round = 0;
    this.maxRounds = 3;
    this.timing = 0;
    this.speed = 1;
    this.coinVisible = true;
    this.result = '';
    this.resultTimer = 0;
  }

  init() {
    this.round = 0;
    this.speed = 1;
    this.startRound();
    Renderer.setSpotlight(0.5, 0.5, 1.3);
  }

  startRound() {
    this.phase = 'dropping';
    this.coinY = 0;
    this.coinVel = 0;
    this.coinVisible = true;
    this.timing = 0;
    this.result = '';
    this.resultTimer = 0;
    // Target zone in middle area
    const zoneCenter = 0.4 + Math.random() * 0.2;
    const zoneSize = 0.1 / this.speed;
    this.targetZone = { start: zoneCenter - zoneSize/2, end: zoneCenter + zoneSize/2 };
  }

  update(dt) {
    if (this.phase === 'dropping') {
      this.coinVel += dt * 200 * this.speed;
      this.coinY += this.coinVel * dt;
      this.timing += dt;

      if (this.coinY > 1) {
        // Missed
        this.result = 'TERLEWAT!';
        this.resultTimer = 1;
        this.phase = 'result';
        Audio.failSound();
      }
    }

    if (this.phase === 'result') {
      this.resultTimer -= dt;
      if (this.resultTimer <= 0) {
        if (this.result === 'TERLEWAT!') {
          Game.actFailure();
        } else {
          this.round++;
          this.speed += 0.3;
          if (this.round >= this.maxRounds) {
            Game.actSuccess();
          } else {
            this.startRound();
          }
        }
      }
    }
  }

  handleInput(code) {
    if (code === 'Space' && this.phase === 'dropping') {
      this.performCatch();
    }
  }

  handleClick(x, y) {
    if (this.phase === 'dropping') {
      this.performCatch();
    }
  }

  performCatch() {
    const normalizedY = this.coinY;
    if (normalizedY >= this.targetZone.start && normalizedY <= this.targetZone.end) {
      this.result = 'SEMPURNA!';
      this.coinVisible = false; // Vanish!
      Audio.magicImpact();
      Audio.coinSound();
      Game.addScore(400 * Game.getCombo());
      Game.setCombo(Game.getCombo() + 1);
      Game.addExcitement(15);
      Particles.emitSparks(Renderer.getW()/2, Renderer.getH() * 0.5, 25);
    } else {
      this.result = 'MELESET!';
      Audio.playTone(200, 0.3, 'square', 0.05);
    }
    this.resultTimer = 1.5;
    this.phase = 'result';
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon
    Renderer.drawBloon(W * 0.2, H * 0.55, 0.9);

    // Hand (catching zone)
    const handY = H * 0.65;
    const zoneStartY = H * (0.3 + this.targetZone.start * 0.4);
    const zoneEndY = H * (0.3 + this.targetZone.end * 0.4);

    // Target zone indicator
    ctx.fillStyle = 'rgba(0,255,100,0.1)';
    ctx.fillRect(W * 0.35, zoneStartY, W * 0.3, zoneEndY - zoneStartY);
    ctx.strokeStyle = 'rgba(0,255,100,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(W * 0.35, zoneStartY, W * 0.3, zoneEndY - zoneStartY);
    ctx.setLineDash([]);

    // Coin
    if (this.coinVisible && this.phase === 'dropping') {
      const coinX = W * 0.5;
      const coinScreenY = H * 0.3 + this.coinY * H * 0.4;
      const coinSize = Math.min(30, W * 0.05);

      // Coin glow
      ctx.save();
      ctx.shadowColor = '#d4af37';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.arc(coinX, coinScreenY, coinSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b8860b';
      ctx.beginPath();
      ctx.arc(coinX, coinScreenY, coinSize * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#d4af37';
      ctx.font = `${coinSize}px Georgia`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', coinX, coinScreenY);
      ctx.restore();
    }

    // Hands (cupped)
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(W * 0.45, handY, 30, 15, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(W * 0.55, handY, 30, 15, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Result text
    if (this.result) {
      ctx.fillStyle = this.result === 'SEMPURNA!' ? '#00ff88' : '#ff3333';
      ctx.font = `bold ${Math.min(36, W*0.06)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText(this.result, W/2, H * 0.15);
    }

    // Round indicator
    ctx.fillStyle = '#d4af37';
    ctx.font = `${Math.min(16, W*0.025)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(`RONDE: ${this.round + 1}/${this.maxRounds}`, W/2, H * 0.08);

    // Instructions
    if (this.phase === 'dropping') {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
      ctx.fillText('Tekan SPACE atau klik saat koin di zona hijau!', W/2, H * 0.9);
    }
  }
}

// ==================== ACT 4: ENDLESS ROPE ====================
class RopeAct {
  constructor() {
    this.ropePoints = [];
    this.numPoints = 20;
    this.phase = 'playing';
    this.knotTarget = 0;
    this.knots = [];
    this.timer = 15;
    this.selectedPoint = -1;
    this.dragging = false;
  }

  init() {
    const W = Renderer.getW(), H = Renderer.getH();
    this.ropePoints = [];
    const startX = W * 0.15;
    const endX = W * 0.85;
    const y = H * 0.5;

    for (let i = 0; i < this.numPoints; i++) {
      const t = i / (this.numPoints - 1);
      this.ropePoints.push({
        x: startX + t * (endX - startX),
        y: y + Math.sin(t * Math.PI * 2) * 30,
        origY: y + Math.sin(t * Math.PI * 2) * 30,
        fixed: i === 0 || i === this.numPoints - 1
      });
    }

    // Create knot targets
    this.knots = [];
    for (let i = 0; i < 3; i++) {
      this.knots.push({
        targetIdx: 4 + i * 5,
        tied: false,
        radius: 20
      });
    }

    this.timer = 20;
    this.phase = 'playing';
    Renderer.setSpotlight(0.5, 0.5, 1.0);
  }

  update(dt) {
    if (this.phase !== 'playing') return;

    this.timer -= dt;
    if (this.timer <= 0) {
      Game.actFailure();
      return;
    }

    // Physics simulation
    for (let i = 1; i < this.ropePoints.length - 1; i++) {
      const p = this.ropePoints[i];
      if (p.fixed || (this.dragging && i === this.selectedPoint)) continue;

      // Spring back to original
      const dy = p.origY - p.y;
      p.y += dy * dt * 2;

      // Wave motion
      p.y += Math.sin(Renderer.getTime() * 3 + i * 0.5) * dt * 10;
    }

    // Check if knots are tied (points near their target positions)
    this.knots.forEach(k => {
      if (k.tied) return;
      const p = this.ropePoints[k.targetIdx];
      // Knot is tied when the point is displaced enough (pulled into a knot)
      const displacement = Math.abs(p.y - p.origY);
      if (displacement > 40) {
        k.tied = true;
        Audio.ropeSound();
        Audio.magicImpact();
        Game.addScore(300 * Game.getCombo());
        Game.addExcitement(10);
        Particles.emitSparks(p.x, p.y, 10);
      }
    });

    if (this.knots.every(k => k.tied)) {
      Game.actSuccess();
    }
  }

  handleClick(x, y) {
    if (this.phase !== 'playing') return;
    // Find nearest rope point
    let minDist = Infinity;
    let nearest = -1;
    this.ropePoints.forEach((p, i) => {
      if (p.fixed) return;
      const d = Math.sqrt((x - p.x) ** 2 + (y - p.y) ** 2);
      if (d < minDist && d < 40) {
        minDist = d;
        nearest = i;
      }
    });

    if (nearest >= 0) {
      // Check if this point is near a knot target
      const isKnot = this.knots.some(k => k.targetIdx === nearest && !k.tied);
      if (isKnot) {
        // Pull the knot
        this.ropePoints[nearest].y -= 60;
        this.ropePoints[nearest].fixed = true;
        Audio.ropeSound();
      } else {
        // Just wiggle
        this.ropePoints[nearest].y += (Math.random() - 0.5) * 40;
        Audio.ropeSound();
      }
    }
  }

  handleInput(code) {
    if (code === 'Space') {
      // Shake the rope
      this.ropePoints.forEach((p, i) => {
        if (!p.fixed) {
          p.y += (Math.random() - 0.5) * 30;
        }
      });
      Audio.ropeSound();
    }
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon
    Renderer.drawBloon(W * 0.1, H * 0.55, 0.7);

    // Draw rope
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.ropePoints[0].x, this.ropePoints[0].y);
    for (let i = 1; i < this.ropePoints.length; i++) {
      const p = this.ropePoints[i];
      const prev = this.ropePoints[i-1];
      const cpx = (prev.x + p.x) / 2;
      const cpy = (prev.y + p.y) / 2;
      ctx.quadraticCurveTo(prev.x, prev.y, cpx, cpy);
    }
    ctx.stroke();

    // Rope highlight
    ctx.strokeStyle = 'rgba(212,175,55,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw knot targets
    this.knots.forEach(k => {
      const p = this.ropePoints[k.targetIdx];
      if (k.tied) {
        // Draw tied knot
        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = '12px Georgia';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦', p.x, p.y);
      } else {
        // Draw target indicator
        ctx.strokeStyle = `rgba(255,100,100,${0.5 + Math.sin(Renderer.getTime() * 4) * 0.3})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.arc(p.x, p.y, k.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Arrow pointing to pull up
        ctx.fillStyle = 'rgba(255,100,100,0.7)';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - k.radius - 15);
        ctx.lineTo(p.x - 5, p.y - k.radius - 5);
        ctx.lineTo(p.x + 5, p.y - k.radius - 5);
        ctx.closePath();
        ctx.fill();
      }
    });

    // Timer
    ctx.fillStyle = this.timer < 5 ? '#ff3333' : '#d4af37';
    ctx.font = `${Math.min(24, W*0.04)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(`WAKTU: ${Math.ceil(this.timer)}`, W/2, H * 0.15);

    // Knots progress
    const tiedCount = this.knots.filter(k => k.tied).length;
    ctx.fillStyle = '#d4af37';
    ctx.font = `${Math.min(16, W*0.025)}px Georgia`;
    ctx.fillText(`SIMPUL: ${tiedCount}/${this.knots.length}`, W/2, H * 0.85);

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${Math.min(12, W*0.02)}px Georgia`;
    ctx.fillText('Klik titik merah untuk mengikat simpul!', W/2, H * 0.92);
  }
}

// ==================== ACT 5: IMPOSSIBLE BOX ====================
class BoxAct {
  constructor() {
    this.phase = 'playing';
    this.tiles = [];
    this.gridSize = 4;
    this.moves = 0;
    this.maxMoves = 20;
    this.boxRotation = 0;
    this.selectedTile = -1;
  }

  init() {
    const W = Renderer.getW(), H = Renderer.getH();
    this.tiles = [];
    const size = Math.min(60, W * 0.1);
    const gridSize = this.gridSize;
    const totalW = gridSize * (size + 4);
    const startX = W/2 - totalW/2;
    const startY = H * 0.35;

    // Create sliding puzzle
    for (let i = 0; i < gridSize * gridSize; i++) {
      const row = Math.floor(i / gridSize);
      const col = i % gridSize;
      this.tiles.push({
        value: i,
        currentPos: i,
        x: startX + col * (size + 4),
        y: startY + row * (size + 4),
        targetX: startX + col * (size + 4),
        targetY: startY + row * (size + 4),
        size: size,
        correct: i
      });
    }

    // Shuffle (ensure solvable)
    this.emptyIdx = gridSize * gridSize - 1;
    for (let i = 0; i < 50; i++) {
      this.moveRandom();
    }
    this.tiles.forEach((t, i) => {
      t.currentPos = i;
    });

    this.moves = 0;
    this.maxMoves = 30;
    this.phase = 'playing';
    this.boxRotation = 0;
    Renderer.setSpotlight(0.5, 0.45, 1.1);
  }

  moveRandom() {
    const neighbors = this.getNeighbors(this.emptyIdx);
    const randNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
    this.swapTiles(this.emptyIdx, randNeighbor);
    this.emptyIdx = randNeighbor;
  }

  getNeighbors(idx) {
    const gs = this.gridSize;
    const row = Math.floor(idx / gs);
    const col = idx % gs;
    const n = [];
    if (row > 0) n.push(idx - gs);
    if (row < gs - 1) n.push(idx + gs);
    if (col > 0) n.push(idx - 1);
    if (col < gs - 1) n.push(idx + 1);
    return n;
  }

  swapTiles(a, b) {
    const temp = this.tiles[a].value;
    this.tiles[a].value = this.tiles[b].value;
    this.tiles[b].value = temp;
  }

  update(dt) {
    this.boxRotation += dt * 0.5;

    // Animate tiles
    const W = Renderer.getW(), H = Renderer.getH();
    const size = this.tiles[0].size;
    const gs = this.gridSize;
    const totalW = gs * (size + 4);
    const startX = W/2 - totalW/2;
    const startY = H * 0.35;

    this.tiles.forEach((t, i) => {
      const row = Math.floor(i / gs);
      const col = i % gs;
      t.targetX = startX + col * (size + 4);
      t.targetY = startY + row * (size + 4);
      t.x += (t.targetX - t.x) * dt * 10;
      t.y += (t.targetY - t.y) * dt * 10;
    });

    // Check win
    if (this.phase === 'playing') {
      let solved = true;
      for (let i = 0; i < this.tiles.length; i++) {
        if (this.tiles[i].value !== i) { solved = false; break; }
      }
      if (solved) {
        Game.actSuccess();
      }
    }
  }

  handleClick(x, y) {
    if (this.phase !== 'playing') return;
    const gs = this.gridSize;

    // Find clicked tile
    for (let i = 0; i < this.tiles.length; i++) {
      const t = this.tiles[i];
      if (x >= t.x && x <= t.x + t.size && y >= t.y && y <= t.y + t.size) {
        // Check if adjacent to empty
        const neighbors = this.getNeighbors(i);
        if (neighbors.includes(this.emptyIdx)) {
          this.swapTiles(i, this.emptyIdx);
          this.emptyIdx = i;
          this.moves++;
          Audio.cardFlip();
          Game.addScore(50 * Game.getCombo());

          if (this.moves >= this.maxMoves) {
            let solved = true;
            for (let j = 0; j < this.tiles.length; j++) {
              if (this.tiles[j].value !== j) { solved = false; break; }
            }
            if (!solved) Game.actFailure();
          }
        }
        break;
      }
    }
  }

  handleInput(code) {}

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon
    Renderer.drawBloon(W * 0.85, H * 0.6, 0.6);

    // Draw box outline (impossible box illusion)
    const boxX = W/2 - 100;
    const boxY = H * 0.2;
    ctx.strokeStyle = 'rgba(212,175,55,0.3)';
    ctx.lineWidth = 1;

    // 3D box wireframe (impossible)
    ctx.save();
    ctx.translate(W/2, H * 0.25);
    ctx.rotate(Math.sin(this.boxRotation) * 0.1);

    // Front face
    ctx.strokeStyle = '#d4af37';
    ctx.strokeRect(-80, -40, 160, 80);
    // Back face (offset - impossible)
    ctx.strokeRect(-60, -60, 160, 80);
    // Connecting lines (impossible connections)
    ctx.beginPath();
    ctx.moveTo(-80, -40); ctx.lineTo(-60, -60);
    ctx.moveTo(80, -40); ctx.lineTo(100, -60);
    ctx.moveTo(-80, 40); ctx.lineTo(-60, 20);
    ctx.moveTo(80, 40); ctx.lineTo(100, 20);
    ctx.stroke();
    ctx.restore();

    // Draw puzzle tiles
    this.tiles.forEach((t, i) => {
      if (t.value === this.gridSize * this.gridSize - 1 && i === this.emptyIdx) return; // Empty space

      const isCorrect = t.value === i;
      ctx.fillStyle = isCorrect ? 'rgba(0,100,0,0.8)' : 'rgba(50,0,0,0.8)';
      ctx.fillRect(t.x, t.y, t.size, t.size);
      ctx.strokeStyle = isCorrect ? '#00ff88' : '#d4af37';
      ctx.lineWidth = 1;
      ctx.strokeRect(t.x, t.y, t.size, t.size);

      // Number
      ctx.fillStyle = isCorrect ? '#00ff88' : '#d4af37';
      ctx.font = `${t.size * 0.4}px Georgia`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.value + 1, t.x + t.size/2, t.y + t.size/2);
    });

    // Moves counter
    ctx.fillStyle = '#d4af37';
    ctx.font = `${Math.min(18, W*0.03)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(`LANGKAH: ${this.moves}/${this.maxMoves}`, W/2, H * 0.85);

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${Math.min(12, W*0.02)}px Georgia`;
    ctx.fillText('Geser kotak untuk menyusun urutan!', W/2, H * 0.92);
  }
}

// ==================== ACT 6: THE PREDICTION ====================
class PredictionAct {
  constructor() {
    this.phase = 'questions';
    this.questions = [];
    this.currentQ = 0;
    this.answers = [];
    this.prediction = '';
    this.revealed = false;
    this.playerNumber = 0;
    this.revealTimer = 0;
  }

  init() {
    this.questions = [
      { text: 'Pilih angka 1-10:', type: 'number', min: 1, max: 10 },
      { text: 'Pilih warna: (1)Merah (2)Biru (3)Hijau', type: 'choice', options: 3 },
      { text: 'Kalikan angka kamu dengan 2', type: 'action' },
      { text: 'Tambahkan 8 hasilnya', type: 'action' },
      { text: 'Bagi 2 hasilnya', type: 'action' },
      { text: 'Kurangi dengan angka asli kamu', type: 'action' }
    ];
    this.currentQ = 0;
    this.answers = [];
    this.phase = 'questions';
    this.revealed = false;
    this.playerNumber = 0;
    this.revealTimer = 0;
    Renderer.setSpotlight(0.5, 0.4, 1.0);
  }

  update(dt) {
    if (this.phase === 'reveal') {
      this.revealTimer += dt;
      if (this.revealTimer > 3) {
        Game.actSuccess();
      }
    }
  }

  handleClick(x, y) {
    if (this.phase !== 'questions') return;
    const W = Renderer.getW(), H = Renderer.getH();
    const q = this.questions[this.currentQ];

    if (q.type === 'number' || q.type === 'choice') {
      // Check button clicks
      const btnW = 60;
      const btnH = 40;
      const startY = H * 0.55;
      const options = q.type === 'number' ? q.max : q.options;
      const cols = Math.min(options, 5);
      const rows = Math.ceil(options / cols);

      for (let i = 0; i < options; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const bx = W/2 - (cols * (btnW + 10))/2 + col * (btnW + 10);
        const by = startY + row * (btnH + 10);

        if (x >= bx && x <= bx + btnW && y >= by && y <= by + btnH) {
          this.answers.push(i + 1);
          if (q.type === 'number') {
            this.playerNumber = i + 1;
          }
          Audio.cardFlip();
          this.currentQ++;
          if (this.currentQ >= this.questions.length) {
            this.showPrediction();
          }
          break;
        }
      }
    } else if (q.type === 'action') {
      // Click to proceed
      this.answers.push(0);
      Audio.cardFlip();
      this.currentQ++;
      if (this.currentQ >= this.questions.length) {
        this.showPrediction();
      }
    }
  }

  showPrediction() {
    // Mathematical prediction: result is always 4
    // (n * 2 + 8) / 2 - n = n + 4 - n = 4
    this.prediction = '4';
    this.phase = 'reveal';
    this.revealTimer = 0;
    Audio.dramaticSting();
    Game.addScore(500 * Game.getCombo());
    Game.addExcitement(25);
    Particles.emitSparks(Renderer.getW()/2, Renderer.getH()*0.4, 30);
  }

  handleInput(code) {
    if (code === 'Space' && this.phase === 'questions') {
      const q = this.questions[this.currentQ];
      if (q.type === 'action') {
        this.answers.push(0);
        Audio.cardFlip();
        this.currentQ++;
        if (this.currentQ >= this.questions.length) {
          this.showPrediction();
        }
      }
    }
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon
    Renderer.drawBloon(W * 0.15, H * 0.6, 0.8);

    if (this.phase === 'questions') {
      const q = this.questions[this.currentQ];

      // Question text
      ctx.fillStyle = '#d4af37';
      ctx.font = `${Math.min(22, W*0.035)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText(q.text, W/2, H * 0.25);

      // Question number
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
      ctx.fillText(`Pertanyaan ${this.currentQ + 1}/${this.questions.length}`, W/2, H * 0.15);

      // Draw buttons for number/choice
      if (q.type === 'number' || q.type === 'choice') {
        const btnW = Math.min(60, W * 0.1);
        const btnH = 40;
        const startY = H * 0.55;
        const options = q.type === 'number' ? q.max : q.options;
        const cols = Math.min(options, 5);

        for (let i = 0; i < options; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const bx = W/2 - (cols * (btnW + 10))/2 + col * (btnW + 10);
          const by = startY + row * (btnH + 10);

          ctx.fillStyle = 'rgba(50,0,0,0.8)';
          ctx.fillRect(bx, by, btnW, btnH);
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by, btnW, btnH);

          ctx.fillStyle = '#d4af37';
          ctx.font = `${Math.min(16, W*0.025)}px Georgia`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(i + 1, bx + btnW/2, by + btnH/2);
        }
      } else {
        // Action button
        const btnW = 200;
        const btnH = 50;
        const bx = W/2 - btnW/2;
        const by = H * 0.55;

        ctx.fillStyle = 'rgba(50,0,0,0.8)';
        ctx.fillRect(bx, by, btnW, btnH);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, btnW, btnH);

        ctx.fillStyle = '#d4af37';
        ctx.font = `${Math.min(16, W*0.025)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('LANJUT →', W/2, by + btnH/2);
      }

      // Show running calculation
      if (this.answers.length > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = `${Math.min(12, W*0.02)}px Georgia`;
        ctx.textAlign = 'left';
        let calcY = H * 0.75;
        this.answers.forEach((a, i) => {
          if (i < this.questions.length && this.questions[i].type !== 'action') {
            ctx.fillText(`Langkah ${i+1}: ${a}`, W * 0.1, calcY);
            calcY += 18;
          }
        });
      }
    }

    if (this.phase === 'reveal') {
      // Dramatic reveal
      const revealAlpha = Math.min(1, this.revealTimer);

      ctx.save();
      ctx.globalAlpha = revealAlpha;

      // Envelope/card
      ctx.fillStyle = '#1a0033';
      const envW = Math.min(250, W * 0.4);
      const envH = envW * 0.6;
      const envX = W/2 - envW/2;
      const envY = H * 0.3;
      ctx.fillRect(envX, envY, envW, envH);
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 3;
      ctx.strokeRect(envX, envY, envW, envH);

      // Prediction number
      ctx.fillStyle = '#d4af37';
      ctx.font = `bold ${envH * 0.5}px Georgia`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.prediction, W/2, envY + envH/2);

      // Explanation
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
      ctx.fillText('Hasilnya SELALU 4, apapun angka yang kamu pilih!', W/2, envY + envH + 40);
      ctx.fillText('(n×2+8)÷2−n = 4', W/2, envY + envH + 65);

      ctx.restore();
    }
  }
}

// ==================== ACT 7: FINAL ACT ====================
class FinalAct {
  constructor() {
    this.phase = 'intro';
    this.stage = 0;
    this.timer = 0;
    this.subActs = [];
    this.currentSubAct = null;
    this.completedSubActs = 0;
    this.totalSubActs = 3;
  }

  init() {
    this.stage = 0;
    this.timer = 3;
    this.phase = 'intro';
    this.completedSubActs = 0;
    this.startSubAct(0);
    Renderer.setSpotlight(0.5, 0.4, 1.5);
  }

  startSubAct(idx) {
    this.stage = idx;
    switch(idx) {
      case 0:
        // Mini card trick
        this.currentSubAct = {
          type: 'cards',
          cards: [],
          target: -1,
          phase: 'show',
          timer: 2,
          done: false
        };
        const W = Renderer.getW();
        for (let i = 0; i < 3; i++) {
          this.currentSubAct.cards.push({
            x: W/2 - 100 + i * 80,
            y: Renderer.getH() * 0.45,
            w: 60, h: 84,
            revealed: true
          });
        }
        this.currentSubAct.target = Math.floor(Math.random() * 3);
        break;
      case 1:
        // Mini coin timing
        this.currentSubAct = {
          type: 'coin',
          coinY: 0,
          coinVel: 0,
          targetZone: { start: 0.35, end: 0.45 },
          phase: 'dropping',
          done: false
        };
        break;
      case 2:
        // Final vanish
        this.currentSubAct = {
          type: 'vanish',
          phase: 'waiting',
          timer: 0,
          clicks: 0,
          required: 5,
          done: false
        };
        break;
    }
  }

  update(dt) {
    if (this.phase === 'intro') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.phase = 'playing';
      }
      return;
    }

    if (!this.currentSubAct || this.currentSubAct.done) return;

    if (this.currentSubAct.type === 'cards') {
      if (this.currentSubAct.phase === 'show') {
        this.currentSubAct.timer -= dt;
        if (this.currentSubAct.timer <= 0) {
          this.currentSubAct.phase = 'select';
          this.currentSubAct.cards.forEach(c => c.revealed = false);
        }
      }
    }

    if (this.currentSubAct.type === 'coin') {
      if (this.currentSubAct.phase === 'dropping') {
        this.currentSubAct.coinVel += dt * 300;
        this.currentSubAct.coinY += this.currentSubAct.coinVel * dt;
        if (this.currentSubAct.coinY > 1) {
          Game.actFailure();
        }
      }
    }

    if (this.currentSubAct.type === 'vanish') {
      this.currentSubAct.timer += dt;
    }
  }

  handleClick(x, y) {
    if (this.phase !== 'playing' || !this.currentSubAct) return;

    if (this.currentSubAct.type === 'cards' && this.currentSubAct.phase === 'select') {
      for (let i = 0; i < this.currentSubAct.cards.length; i++) {
        const c = this.currentSubAct.cards[i];
        if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
          if (i === this.currentSubAct.target) {
            this.completeSubAct();
          } else {
            Game.actFailure();
          }
          break;
        }
      }
    }

    if (this.currentSubAct.type === 'coin' && this.currentSubAct.phase === 'dropping') {
      const ny = this.currentSubAct.coinY;
      if (ny >= this.currentSubAct.targetZone.start && ny <= this.currentSubAct.targetZone.end) {
        this.completeSubAct();
      } else {
        Game.actFailure();
      }
    }

    if (this.currentSubAct.type === 'vanish') {
      this.currentSubAct.clicks++;
      Audio.magicImpact();
      Particles.emitSparks(x, y, 10);
      if (this.currentSubAct.clicks >= this.currentSubAct.required) {
        this.completeSubAct();
      }
    }
  }

  handleInput(code) {
    if (code === 'Space' && this.phase === 'playing') {
      if (this.currentSubAct && this.currentSubAct.type === 'coin' && this.currentSubAct.phase === 'dropping') {
        const ny = this.currentSubAct.coinY;
        if (ny >= this.currentSubAct.targetZone.start && ny <= this.currentSubAct.targetZone.end) {
          this.completeSubAct();
        } else {
          Game.actFailure();
        }
      }
    }
  }

  completeSubAct() {
    this.currentSubAct.done = true;
    this.completedSubActs++;
    Audio.successSound();
    Game.addScore(500 * Game.getCombo());
    Game.setCombo(Game.getCombo() + 1);
    Game.addExcitement(15);
    Particles.emitSparks(Renderer.getW()/2, Renderer.getH()*0.4, 20);

    if (this.completedSubActs >= this.totalSubActs) {
      setTimeout(() => Game.actSuccess(), 1000);
    } else {
      setTimeout(() => this.startSubAct(this.stage + 1), 1000);
    }
  }

  draw() {
    const ctx = Renderer.getCtx();
    const W = Renderer.getW(), H = Renderer.getH();

    // Draw Bloon (more dramatic)
    Renderer.drawBloon(W * 0.5, H * 0.65, 1.0);

    if (this.phase === 'intro') {
      ctx.fillStyle = '#d4af37';
      ctx.font = `bold ${Math.min(36, W*0.06)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText('AKSI TERAKHIR', W/2, H * 0.3);
      ctx.font = `${Math.min(18, W*0.03)}px Georgia`;
      ctx.fillText('Semua trik menjadi satu...', W/2, H * 0.4);
      return;
    }

    if (!this.currentSubAct) return;

    // Stage indicator
    ctx.fillStyle = '#d4af37';
    ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(`BAGIAN ${this.stage + 1}/${this.totalSubActs}`, W/2, H * 0.1);

    if (this.currentSubAct.type === 'cards') {
      this.currentSubAct.cards.forEach((c, i) => {
        ctx.fillStyle = c.revealed ? '#fff' : '#1a0033';
        ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x, c.y, c.w, c.h);
        if (c.revealed) {
          ctx.fillStyle = '#8b0000';
          ctx.font = `${c.w * 0.4}px Georgia`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(['♠','♥','♦'][i], c.x + c.w/2, c.y + c.h/2);
        }
      });
      if (this.currentSubAct.phase === 'select') {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
        ctx.textAlign = 'center';
        ctx.fillText('Pilih kartu yang benar!', W/2, H * 0.8);
      }
    }

    if (this.currentSubAct.type === 'coin') {
      const coinX = W * 0.5;
      const coinScreenY = H * 0.2 + this.currentSubAct.coinY * H * 0.5;

      // Target zone
      const zoneStartY = H * 0.2 + this.currentSubAct.targetZone.start * H * 0.5;
      const zoneEndY = H * 0.2 + this.currentSubAct.targetZone.end * H * 0.5;
      ctx.fillStyle = 'rgba(0,255,100,0.1)';
      ctx.fillRect(W * 0.35, zoneStartY, W * 0.3, zoneEndY - zoneStartY);
      ctx.strokeStyle = 'rgba(0,255,100,0.5)';
      ctx.strokeRect(W * 0.35, zoneStartY, W * 0.3, zoneEndY - zoneStartY);

      // Coin
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.arc(coinX, coinScreenY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '16px Georgia';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', coinX, coinScreenY);

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = `${Math.min(14, W*0.022)}px Georgia`;
      ctx.fillText('Klik/SPACE saat di zona hijau!', W/2, H * 0.85);
    }

    if (this.currentSubAct.type === 'vanish') {
      // Disappearing Bloon effect
      const progress = this.currentSubAct.clicks / this.currentSubAct.required;
      ctx.save();
      ctx.globalAlpha = 1 - progress;

      // Draw a large mystical circle
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(W/2, H * 0.4, 80 + progress * 40, 0, Math.PI * 2 * progress);
      ctx.stroke();

      // Mystical symbols
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + Renderer.getTime();
        const r = 60 + progress * 30;
        const sx = W/2 + Math.cos(angle) * r;
        const sy = H * 0.4 + Math.sin(angle) * r;
        ctx.fillStyle = `rgba(212,175,55,${1 - progress})`;
        ctx.font = '20px Georgia';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦', sx, sy);
      }

      ctx.restore();

      ctx.fillStyle = '#d4af37';
      ctx.font = `${Math.min(16, W*0.025)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.fillText(`Klik lingkaran! (${this.currentSubAct.clicks}/${this.currentSubAct.required})`, W/2, H * 0.8);
    }

    // Completed sub-acts indicator
    for (let i = 0; i < this.totalSubActs; i++) {
      const ix = W/2 - (this.totalSubActs * 30)/2 + i * 30;
      ctx.fillStyle = i < this.completedSubActs ? '#00ff88' : '#333';
      ctx.beginPath();
      ctx.arc(ix + 10, H * 0.05, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ==================== INIT ====================
window.addEventListener('load', () => Game.init());
</script>
